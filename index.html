<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>広島駅バスサイネージ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Hiragino Sans", "Noto Sans JP", "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #eef4ff 0%, #f5f7fb 55%, #f3f0ed 100%);
      color: #1f1f1f;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    .layout {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(320px, 55%) minmax(320px, 1fr);
      gap: 1.5rem;
      align-items: stretch;
    }

    .panel {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 18px;
      padding: 1.6rem;
      box-shadow: 0 20px 50px rgba(30, 49, 84, 0.14);
    }

    .map-panel {
      display: flex;
      flex-direction: column;
    }

    .map-panel .map-wrapper {
      display: block;
    }

    .map-panel .map-wrapper img {
      width: 100%;
      display: block;
    }

    .map-panel h1,
    .map-panel p {
      margin: 0 0 0.6rem;
    }

    .map-panel h1 {
      font-size: clamp(1.2rem, 2.3vw, 1.7rem);
      letter-spacing: 0.08em;
    }

    .map-panel p {
      color: #4c566a;
      font-size: 0.95rem;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      margin-top: 0.5rem;
      border-radius: 16px;
      overflow: hidden;
      background: #dfe3ec;
    }

    .map-wrapper img {
      display: block;
    }

    .marker {
      position: absolute;
      border-radius: 6px;
      pointer-events: none;
      background: rgba(140, 140, 140, 0.25);
      box-shadow: 0 0 0 1px rgba(200, 200, 200, 0.4);
      transition: background 0.3s ease, transform 0.3s ease;
      z-index: 3;
    }

    .marker::after {
      content: attr(data-stop-id);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: min(2vw, 18px);
      color: rgba(255, 255, 255, 0.5);
      text-shadow: none;
    }

    /* Active markers: slightly enlarged */
    .marker.active-kami,
    .marker.active-hachi {
      transform: scale(1.15);
    }

    .marker.active-kami::after,
    .marker.active-hachi::after {
      color: #fff;
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.3);
    }

    /* Phase-driven marker colors */
    .phase-kami .marker.active-kami {
      background: rgba(53, 94, 185, 0.9);
      box-shadow: 0 0 8px rgba(53, 94, 185, 0.5);
    }

    .phase-hachi .marker.active-kami {
      background: rgba(53, 94, 185, 0.2);
      box-shadow: 0 0 0 1px rgba(200, 200, 200, 0.4);
    }

    .phase-hachi .marker.active-hachi {
      background: rgba(255, 136, 0, 0.9);
      box-shadow: 0 0 8px rgba(255, 136, 0, 0.5);
    }

    .phase-kami .marker.active-hachi {
      background: rgba(255, 136, 0, 0.2);
      box-shadow: 0 0 0 1px rgba(200, 200, 200, 0.4);
    }

    /* Dual-route marker: alternate between blue and orange */
    .phase-kami .marker.active-kami.active-hachi {
      background: rgba(53, 94, 185, 0.9);
      box-shadow: 0 0 8px rgba(53, 94, 185, 0.5);
    }

    .phase-hachi .marker.active-kami.active-hachi {
      background: rgba(255, 136, 0, 0.9);
      box-shadow: 0 0 8px rgba(255, 136, 0, 0.5);
    }

    .callout-layer,
    .callout-lines {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .callout-lines {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .callout-layer {
      z-index: 4;
    }

    .callout-line {
      stroke-width: 0.6;
      stroke-linecap: round;
      transition: opacity 0.15s ease;
    }

    .callout-line--kami {
      stroke: #2c56d2;
    }

    .callout-line--hachi {
      stroke: #f68b1f;
    }

    /* Phase-driven line visibility */
    .phase-kami .callout-line--kami {
      opacity: 1;
    }

    .phase-kami .callout-line--hachi {
      opacity: 0.1;
    }

    .phase-hachi .callout-line--hachi {
      opacity: 1;
    }

    .phase-hachi .callout-line--kami {
      opacity: 0.1;
    }

    .callout {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(28px, 3vw, 44px);
      aspect-ratio: 1;
      border-radius: 50%;
      color: #fff;
      font-weight: 700;
      font-size: clamp(1rem, 1.5vw, 1.3rem);
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: opacity 0.15s ease;
    }

    .callout--kami {
      background: #2c56d2;
    }

    .callout--hachi {
      background: #f68b1f;
    }

    /* Phase-driven icon visibility */
    .phase-kami .callout--kami {
      opacity: 1;
    }

    .phase-kami .callout--hachi {
      opacity: 0;
      pointer-events: none;
    }

    .phase-hachi .callout--hachi {
      opacity: 1;
    }

    .phase-hachi .callout--kami {
      opacity: 0;
      pointer-events: none;
    }

    .info-panel header {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    .info-panel h2 {
      margin: 0;
      font-size: 1.1rem;
    }

    .clock-display {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin: 0.3rem 0 0.2rem;
    }

    .clock-time {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: #1a1f2e;
      line-height: 1;
    }

    .clock-mode {
      font-size: 0.85rem;
      color: #8a90a0;
      background: #f0f2f7;
      padding: 0.2rem 0.7rem;
      border-radius: 8px;
      order: -1;
    }

    .time-settings {
      margin-top: 0.4rem;
    }

    .time-settings-toggle {
      background: none;
      border: none;
      color: #5a6480;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.2rem 0;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .time-settings-toggle:hover {
      color: #1f7aec;
    }

    .time-settings-body {
      display: none;
      margin-top: 0.4rem;
      padding: 0.6rem;
      background: #f6f7fb;
      border-radius: 10px;
    }

    .time-settings-body.open {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .time-settings-body input[type="time"] {
      font-size: 1.1rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid #d0d5e0;
      border-radius: 6px;
    }

    .time-settings-body button {
      background: #1f7aec;
      border: none;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .time-settings-body button.secondary {
      background: #e2e5ec;
      color: #2e3442;
    }

    .hint {
      margin: 0.2rem 0 1rem;
      font-size: 0.85rem;
      color: #6c7283;
    }

    .next-stops {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .next-card {
      border-radius: 12px;
      background: #f6f7fb;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      border: 1px solid rgba(68, 82, 122, 0.08);
    }

    .next-main {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .next-time {
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .next-platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      flex: 1;
    }

    .platform-big {
      flex: 0 1 calc(50% - 0.4rem);
      min-width: 70px;
      background: #fff;
      border-radius: 12px;
      text-align: center;
      font-size: clamp(1.3rem, 3vw, 2.3rem);
      font-weight: 700;
      padding: 0.2rem 0.4rem;
      color: #1f1f1f;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.08);
    }

    .platform-big small {
      display: block;
      font-size: 0.65rem;
      color: #666;
    }

    .next-card h3 {
      margin: 0;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .next-card .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8em;
      height: 1.8em;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
    }

    .badge-kami {
      background: #2c56d2;
    }

    .badge-hachi {
      background: #f68b1f;
    }

    .next-card .time {
      font-size: 1.6rem;
      font-variant-numeric: tabular-nums;
    }

    .next-card .platform {
      font-size: 0.95rem;
      color: #3f4657;
    }

    .next-card .meta {
      font-size: 0.85rem;
      color: #6b7082;
    }

    .timeline {
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.06);
      background: #fff;
      padding: 0.8rem;
      max-height: 60vh;
      overflow: auto;
    }

    .timeline h4 {
      margin: 0 0 0.4rem;
      font-size: 0.95rem;
      color: #6f7688;
    }

    .trip-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      max-height: 320px;
      overflow-y: auto;
    }

    .trip {
      display: grid;
      grid-template-columns: 70px 50px 1fr;
      gap: 0.4rem;
      align-items: center;
      padding: 0.4rem 0.2rem;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.08);
    }

    .trip:last-child {
      border-bottom: none;
    }

    .trip-time {
      font-size: 1.4rem;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .trip-platform {
      font-size: 1.1rem;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: center;
      color: #1c263d;
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 0.15rem 0;
      background: #fff;
    }

    .trip-body {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .trip-route {
      font-weight: 600;
    }

    .trip-headsign-inline {
      font-weight: 400;
      color: #888;
    }

    .trip-headsign {
      font-size: 0.9rem;
      color: #666d7e;
    }

    .trip-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      font-size: 0.85rem;
    }

    .chip {
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      background: #f0f3fa;
      color: #374053;
    }

    .chip-platform {
      display: none;
    }

    .chip-kami {
      background: rgba(44, 86, 210, 0.12);
      color: #1e3b99;
    }

    .chip-hachi {
      background: rgba(246, 139, 31, 0.12);
      color: #b15400;
    }

    .delay-badge {
      display: inline-block;
      padding: 0.15em 0.5em;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .delay-badge--late {
      background: rgba(220, 38, 38, 0.12);
      color: #b91c1c;
    }

    .delay-badge--ontime {
      background: rgba(22, 163, 74, 0.12);
      color: #15803d;
    }

    .delay-badge--early {
      background: rgba(37, 99, 235, 0.12);
      color: #1d4ed8;
    }

    .card-delay {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 0.3rem;
    }

    .error {
      color: #cc1f1f;
      margin: 0.5rem 0;
      font-size: 0.9rem;
    }

    .trip--soon {
      animation: soonGlow 1.2s ease-in-out infinite;
      border-radius: 10px;
      padding: 0.6rem 0.4rem;
    }

    @keyframes soonGlow {
      0% {
        background: #fff6d5;
        box-shadow: 0 0 10px rgba(255, 198, 0, 0.25);
      }

      100% {
        background: #ffe48a;
        box-shadow: 0 0 30px rgba(255, 198, 0, 0.45);
      }
    }

    @media (max-width: 960px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .map-panel {
        order: 2;
      }

      .info-panel {
        order: 1;
      }
    }
  </style>
</head>

<body>
  <main class="layout">
    <section class="map-panel panel">
      <h1>バスのりば案内（広島駅南口）</h1>
      <div class="map-wrapper" id="map-wrapper">
        <img src="test2.png" alt="広島駅南口バスのりばマップ">
        <svg class="callout-lines" id="callout-lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div class="callout-layer" id="callout-layer"></div>
      </div>
    </section>
    <section class="info-panel panel">
      <header>
        <h2>紙屋町 / 八丁堀 行きバス サイネージ</h2>
        <div class="clock-display">
          <span class="clock-time" id="clock-time">--:--</span>
          <span class="clock-mode" id="clock-mode">現在時刻</span>
        </div>
        <div class="time-settings">
          <button type="button" class="time-settings-toggle" id="settings-toggle">⚙ 時刻設定</button>
          <div class="time-settings-body" id="settings-body">
            <input type="time" id="time-input" step="60" value="09:00">
            <button type="button" id="apply-time">この時刻で表示</button>
            <button type="button" id="now-time" class="secondary">現在時刻に戻す</button>
          </div>
        </div>
        <p class="hint">データ: hiroshima_station_weekend_timetable.csv（週末ダイヤ）</p>
      </header>
      <div class="next-stops">
        <article class="next-card" id="card-kami">
          <h3><span class="badge badge-kami">紙</span>紙屋町通過</h3>
          <div class="next-main">
            <div class="next-time" data-field="time">--:--</div>
            <div class="next-platforms" data-field="platforms">
              <span class="platform-big">--</span>
            </div>
          </div>
          <div class="meta" data-field="meta">最初のバスを検索しています…</div>
        </article>
        <article class="next-card" id="card-hachi">
          <h3><span class="badge badge-hachi">八</span>八丁堀通過</h3>
          <div class="next-main">
            <div class="next-time" data-field="time">--:--</div>
            <div class="next-platforms" data-field="platforms">
              <span class="platform-big">--</span>
            </div>
          </div>
          <div class="meta" data-field="meta">最初のバスを検索しています…</div>
        </article>
      </div>
      <div class="timeline">

        <ul class="trip-list" id="trip-list"></ul>
        <p class="error" id="error" hidden></p>
      </div>
    </section>
  </main>
  <script src="timetable_fallback.js"></script>
  <script>
    const STOP_CONFIGS = {
      1: { left: 67.38, top: 40.03, width: 3.67, height: 2.83 },
      2: { left: 67.38, top: 35.66, width: 3.67, height: 2.83 },
      3: { left: 67.38, top: 31.29, width: 3.67, height: 2.78 },
      4: { left: 67.38, top: 26.97, width: 3.67, height: 2.78 },
      5: { left: 67.38, top: 22.69, width: 3.67, height: 2.87 },
      6: { left: 46.38, top: 35.87, width: 3.56, height: 2.83 },
      7: { left: 46.38, top: 31.72, width: 3.62, height: 2.74 },
      8: { left: 46.38, top: 27.31, width: 3.62, height: 2.91 },
      9: { left: 46.38, top: 23.07, width: 3.62, height: 2.87 },
      16: { left: 37.72, top: 92.29, width: 4.44, height: 3.38 },
      17: { left: 24.89, top: 64.51, width: 4.22, height: 3.25 },
      20: { left: 25.66, top: 28.77, width: 4.5, height: 3.34 },
      21: { left: 37.94, top: 6.59, width: 4.61, height: 3.42 },
      23: { left: 25, top: 4.45, width: 4.44, height: 3.25 }
    };
    const MAP_CENTER = { x: 50, y: 50 };
    const CALLOUT_DISTANCE = 8;
    const CALLOUT_PERP_SPACING = 5.0;
    const CALLOUT_SLOT_SEQUENCE = [-1, 1, -2, 2, -3, 3, 0];

    const mapWrapper = document.getElementById("map-wrapper");
    const calloutLayer = document.getElementById("callout-layer");
    const calloutLines = document.getElementById("callout-lines");
    const tripListEl = document.getElementById("trip-list");
    const timeInput = document.getElementById("time-input");
    const applyTimeBtn = document.getElementById("apply-time");
    const nowBtn = document.getElementById("now-time");
    const errorEl = document.getElementById("error");
    const kamiCard = document.getElementById("card-kami");
    const hachiCard = document.getElementById("card-hachi");
    const clockTimeEl = document.getElementById("clock-time");
    const clockModeEl = document.getElementById("clock-mode");
    const settingsToggle = document.getElementById("settings-toggle");
    const settingsBody = document.getElementById("settings-body");
    const DISPLAY_COUNT = 10;

    let uidCounter = 0;
    const nextUid = () => `trip-${uidCounter++}`;
    const dedupeByPlatform = (trips) => {
      const seen = new Set();
      return trips.filter((trip) => {
        if (!trip.platform || seen.has(trip.platform)) {
          return false;
        }
        seen.add(trip.platform);
        return true;
      });
    };

    const markers = new Map();
    Object.entries(STOP_CONFIGS).forEach(([stopId, box]) => {
      const marker = document.createElement("div");
      marker.className = "marker";
      marker.dataset.stopId = stopId;
      marker.style.left = `${box.left}%`;
      marker.style.top = `${box.top}%`;
      marker.style.width = `${box.width}%`;
      marker.style.height = `${box.height}%`;
      box.centerX = box.left + box.width / 2;
      box.centerY = box.top + box.height / 2;
      mapWrapper.appendChild(marker);
      markers.set(String(stopId), marker);
    });

    const state = {
      trips: [],
      sortedTrips: [],
      realtimeDelays: {},
    };

    let useCurrentTime = true;
    let autoUpdateTimer = null;

    function startAutoUpdate() {
      stopAutoUpdate();
      autoUpdateTimer = setInterval(() => {
        if (useCurrentTime) {
          setTimeToCurrent();
          fetchRealtimeDelays().then(() => updateDisplay());
          updateClockDisplay();
        }
      }, 15000);
      // Fetch realtime every 30s independently
      setInterval(() => fetchRealtimeDelays().then(() => updateDisplay()), 30000);
    }

    function stopAutoUpdate() {
      if (autoUpdateTimer !== null) {
        clearInterval(autoUpdateTimer);
        autoUpdateTimer = null;
      }
    }

    async function fetchRealtimeDelays() {
      try {
        const resp = await fetch("/api/realtime", { cache: "no-store" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.realtimeDelays = data.delays || {};
        console.log(`[GTFS-RT] ${Object.keys(state.realtimeDelays).length} trips with delay data`);
      } catch (e) {
        console.warn("[GTFS-RT] fetch failed:", e.message);
      }
    }

    init();

    async function init() {
      await loadTimetable();
      setDefaultTime();
      await fetchRealtimeDelays();
      updateDisplay();
      updateClockDisplay();
      startAutoUpdate();
      startPhaseToggle();
      settingsToggle.addEventListener("click", () => {
        settingsBody.classList.toggle("open");
      });
      applyTimeBtn.addEventListener("click", () => {
        useCurrentTime = false;
        stopAutoUpdate();
        updateDisplay();
        updateClockDisplay();
      });
      nowBtn.addEventListener("click", () => {
        useCurrentTime = true;
        setTimeToCurrent();
        updateDisplay();
        updateClockDisplay();
        startAutoUpdate();
      });
    }

    function startPhaseToggle() {
      mapWrapper.classList.add("phase-kami");
      setInterval(() => {
        if (mapWrapper.classList.contains("phase-kami")) {
          mapWrapper.classList.remove("phase-kami");
          mapWrapper.classList.add("phase-hachi");
        } else {
          mapWrapper.classList.remove("phase-hachi");
          mapWrapper.classList.add("phase-kami");
        }
      }, 1000);
    }

    function updateClockDisplay() {
      clockTimeEl.textContent = timeInput.value || "--:--";
      clockModeEl.textContent = useCurrentTime ? "現在時刻" : "手動設定";
    }

    async function loadTimetable() {
      try {
        const csvText = await resolveCsvText();
        const rows = parseCsv(csvText);
        state.trips = rows.map(normalizeRow).filter(Boolean);
        state.sortedTrips = [...state.trips].sort((a, b) => a.minutes - b.minutes);
      } catch (error) {
        errorEl.hidden = false;
        errorEl.textContent = `時刻表の読み込みに失敗しました: ${error.message}`;
        console.error(error);
      }
    }

    async function resolveCsvText() {
      if (window.location.protocol !== "file:") {
        try {
          const response = await fetch("hiroshima_station_weekend_timetable.csv", {
            cache: "no-store",
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return await response.text();
        } catch (error) {
          console.warn("CSV fetch failed, falling back to embedded data.", error);
        }
      }
      if (typeof window.HIROSHIMA_TIMETABLE_CSV === "string" && window.HIROSHIMA_TIMETABLE_CSV.trim()) {
        return window.HIROSHIMA_TIMETABLE_CSV;
      }
      throw new Error("CSV を読み込めませんでした。ローカル閲覧時は http サーバー経由で開いてください。");
    }

    function parseCsv(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      const header = lines.shift().replace(/\r/g, "").split(",");
      return lines.map((line) => {
        const cleanLine = line.replace(/\r/g, "");
        const cells = cleanLine.split(",");
        const record = {};
        header.forEach((key, idx) => {
          record[key] = cells[idx] ?? "";
        });
        return record;
      });
    }

    function normalizeRow(row) {
      if (!row || !row.hiroshima_departure_time) {
        return null;
      }
      const time = row.hiroshima_departure_time.trim();
      const [h = "0", m = "0"] = time.split(":");
      const minutes = Number(h) * 60 + Number(m);
      return {
        id: row.trip_id || nextUid(),
        tripId: (row.trip_id || "").trim(),
        route: row.route_name || "系統名未定",
        headsign: row.trip_headsign || "",
        platform: (row.platform_code || "").trim(),
        time,
        minutes,
        stopsKami: row.stops_kamiyacho_after_hiroshima === "1",
        stopsHachi: row.stops_hatchobori_after_hiroshima === "1",
      };
    }

    function setDefaultTime() {
      if (state.sortedTrips.length === 0) {
        return;
      }
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      timeInput.value = `${hh}:${mm}`;
    }

    function setTimeToCurrent() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      timeInput.value = `${hh}:${mm}`;
    }

    function updateDisplay() {
      if (!state.sortedTrips.length) {
        return;
      }
      const referenceMinutes = getReferenceMinutes();
      const upcoming = getUpcomingTrips(referenceMinutes, DISPLAY_COUNT);
      renderTimeline(upcoming);
      const nextKami = getNextTripsGroup("stopsKami", referenceMinutes);
      const nextHachi = getNextTripsGroup("stopsHachi", referenceMinutes);
      updateCard(kamiCard, nextKami, "紙屋町");
      updateCard(hachiCard, nextHachi, "八丁堀");
      updateMapHighlights(nextKami, nextHachi);
    }

    function getReferenceMinutes() {
      const [h = "0", m = "0"] = (timeInput.value || "00:00").split(":");
      return Number(h) * 60 + Number(m);
    }

    function getUpcomingTrips(referenceMinutes, count) {
      return state.sortedTrips
        .filter((trip) => trip.platform)
        .map((trip) => ({
          ...trip,
          eta: minutesUntil(trip.minutes, referenceMinutes),
        }))
        .sort((a, b) => a.eta - b.eta)
        .slice(0, count);
    }

    function minutesUntil(minutes, reference) {
      let diff = minutes - reference;
      if (diff < 0) {
        diff += 24 * 60;
      }
      return diff;
    }

    function getNextTripsGroup(key, referenceMinutes) {
      const trips = state.sortedTrips.filter((trip) => trip[key] && trip.platform);
      if (!trips.length) {
        return [];
      }
      let bestTrip = trips[0];
      let bestDiff = minutesUntil(bestTrip.minutes, referenceMinutes);
      trips.forEach((trip) => {
        const diff = minutesUntil(trip.minutes, referenceMinutes);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestTrip = trip;
        }
      });
      const threshold = bestDiff + 3;
      return trips
        .map((trip) => ({
          ...trip,
          eta: minutesUntil(trip.minutes, referenceMinutes),
        }))
        .filter((trip) => trip.eta >= bestDiff && trip.eta <= threshold)
        .sort((a, b) => a.eta - b.eta || a.minutes - b.minutes);
    }

    function renderTimeline(trips) {
      tripListEl.innerHTML = "";
      if (!trips.length) {
        const empty = document.createElement("li");
        empty.textContent = "表示できる便がありません。";
        tripListEl.appendChild(empty);
        return;
      }
      const fragment = document.createDocumentFragment();
      trips.forEach((trip) => {
        const li = document.createElement("li");
        li.className = "trip";
        if (trip.eta !== undefined && trip.eta <= 3) {
          li.classList.add("trip--soon");
        }
        const time = document.createElement("div");
        time.className = "trip-time";
        time.textContent = trip.time.slice(0, 5);
        const platformBig = document.createElement("div");
        platformBig.className = "trip-platform";
        platformBig.textContent = trip.platform || "-";
        const body = document.createElement("div");
        body.className = "trip-body";
        const route = document.createElement("div");
        route.className = "trip-route";
        const routeName = document.createElement("span");
        routeName.textContent = trip.route;
        route.append(routeName);
        if (trip.headsign) {
          const hs = document.createElement("span");
          hs.className = "trip-headsign-inline";
          hs.textContent = `　${trip.headsign}`;
          route.append(hs);
        }
        const meta = document.createElement("div");
        meta.className = "trip-meta";
        const platform = document.createElement("span");
        platform.className = "chip chip-platform";
        platform.textContent = `のりば ${trip.platform || "-"}`;
        meta.append(platform);
        if (trip.stopsKami) {
          const kamiChip = document.createElement("span");
          kamiChip.className = "chip chip-kami";
          kamiChip.textContent = "紙経由";
          meta.append(kamiChip);
        }
        if (trip.stopsHachi) {
          const hachiChip = document.createElement("span");
          hachiChip.className = "chip chip-hachi";
          hachiChip.textContent = "八経由";
          meta.append(hachiChip);
        }
        // Delay badge
        const delayInfo = state.realtimeDelays[trip.tripId];
        if (delayInfo !== undefined) {
          const delayBadge = document.createElement("span");
          delayBadge.className = "delay-badge";
          const delaySec = delayInfo.delay;
          if (delaySec > 0) {
            const mins = Math.ceil(delaySec / 60);
            delayBadge.classList.add("delay-badge--late");
            delayBadge.textContent = `+${mins}分遅れ`;
          } else if (delaySec < 0) {
            const mins = Math.floor(Math.abs(delaySec) / 60);
            delayBadge.classList.add("delay-badge--early");
            delayBadge.textContent = `${mins}分早着`;
          } else {
            delayBadge.classList.add("delay-badge--ontime");
            delayBadge.textContent = "定刻";
          }
          meta.append(delayBadge);
        }
        body.append(route, meta);
        li.append(time, platformBig, body);
        fragment.append(li);
      });
      tripListEl.appendChild(fragment);
    }

    function updateCard(card, trips, label) {
      const timeEl = card.querySelector('[data-field="time"]');
      const platformsEl = card.querySelector('[data-field="platforms"]');
      const metaEl = card.querySelector('[data-field="meta"]');
      platformsEl.innerHTML = "";
      if (!trips.length) {
        timeEl.textContent = "--:--";
        metaEl.textContent = `${label} を通過する便が見つかりません。`;
        const placeholder = document.createElement("span");
        placeholder.className = "platform-big";
        placeholder.textContent = "--";
        platformsEl.appendChild(placeholder);
        return;
      }
      const firstTrip = trips[0];
      timeEl.textContent = firstTrip.time.slice(0, 5);
      const displayTrips = dedupeByPlatform(trips);
      if (displayTrips.length === 0) {
        metaEl.textContent = `${label} を通過する便が見つかりません。`;
        timeEl.textContent = "--:--";
        const placeholder = document.createElement("span");
        placeholder.className = "platform-big";
        placeholder.textContent = "--";
        platformsEl.appendChild(placeholder);
        return;
      }
      displayTrips.sort((a, b) => Number(a.platform) - Number(b.platform));
      displayTrips.forEach((trip) => {
        const badge = document.createElement("span");
        badge.className = "platform-big";
        badge.textContent = trip.platform;
        platformsEl.appendChild(badge);
      });
      metaEl.textContent = "";
      // Show delay for the first trip
      let existingDelay = card.querySelector(".card-delay");
      if (!existingDelay) {
        existingDelay = document.createElement("div");
        existingDelay.className = "card-delay";
        metaEl.after(existingDelay);
      }
      const firstDelay = state.realtimeDelays[firstTrip.tripId];
      if (firstDelay !== undefined) {
        const delaySec = firstDelay.delay;
        if (delaySec > 0) {
          const mins = Math.ceil(delaySec / 60);
          existingDelay.innerHTML = `<span class="delay-badge delay-badge--late">+${mins}分遅れ</span>`;
        } else if (delaySec < 0) {
          const mins = Math.floor(Math.abs(delaySec) / 60);
          existingDelay.innerHTML = `<span class="delay-badge delay-badge--early">${mins}分早着</span>`;
        } else {
          existingDelay.innerHTML = `<span class="delay-badge delay-badge--ontime">定刻</span>`;
        }
      } else {
        existingDelay.innerHTML = "";
      }
    }

    function updateMapHighlights(kamiTrips, hachiTrips) {
      markers.forEach((marker) => {
        marker.classList.remove("active-kami", "active-hachi");
      });
      calloutLayer.innerHTML = "";
      while (calloutLines.firstChild) {
        calloutLines.removeChild(calloutLines.firstChild);
      }
      const slotUsage = new Map();
      const highlightSets = [
        { trips: kamiTrips, markerClass: "active-kami", calloutClass: "callout--kami", lineClass: "callout-line--kami", label: "紙" },
        { trips: hachiTrips, markerClass: "active-hachi", calloutClass: "callout--hachi", lineClass: "callout-line--hachi", label: "八" },
      ];
      highlightSets.forEach(({ trips, markerClass, calloutClass, lineClass, label }) => {
        dedupeByPlatform(trips).forEach((trip) => {
          const stopId = trip.platform;
          const config = STOP_CONFIGS[stopId];
          if (!stopId || !config) {
            return;
          }
          const marker = markers.get(String(stopId));
          marker?.classList.add(markerClass);
          const slot = nextSlotForStop(slotUsage, stopId);
          const { x, y } = computeCalloutPosition(config, slot);
          addCallout(label, calloutClass, x, y);
          addCalloutLine(config, lineClass, x, y);
        });
      });
    }

    function nextSlotForStop(cache, stopId) {
      const used = cache.get(stopId) || 0;
      cache.set(stopId, used + 1);
      return CALLOUT_SLOT_SEQUENCE[used] ?? 0;
    }

    function computeCalloutPosition(config, slotOffset) {
      const centerX = config.centerX;
      const centerY = config.centerY;
      // For stops 1,2 (bottom-right cluster), go diagonal-down-right to avoid overlap
      const stopNum = Object.entries(STOP_CONFIGS).find(([, v]) => v === config)?.[0];
      let dirX, dirY;
      if (stopNum === "1" || stopNum === "2") {
        dirX = 1;
        dirY = 1;
      } else {
        // Default: go horizontal, left for left-side stops, right for right-side
        dirX = centerX < MAP_CENTER.x ? -1 : 1;
        dirY = 0;
      }
      const vertOffset = slotOffset * 2.5;
      let targetX = centerX + dirX * CALLOUT_DISTANCE;
      let targetY = centerY + dirY * CALLOUT_DISTANCE + vertOffset;
      targetX = Math.min(97, Math.max(3, targetX));
      targetY = Math.min(97, Math.max(3, targetY));
      return { x: targetX, y: targetY };
    }

    function addCallout(label, className, x, y) {
      const el = document.createElement("div");
      el.className = `callout ${className}`;
      el.style.left = `${x}%`;
      el.style.top = `${y}%`;
      el.textContent = label;
      calloutLayer.appendChild(el);
    }

    function addCalloutLine(config, className, x, y) {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x);
      line.setAttribute("y1", y);
      line.setAttribute("x2", config.centerX);
      line.setAttribute("y2", config.centerY);
      line.classList.add("callout-line", className);
      calloutLines.appendChild(line);
    }
  </script>
</body>
